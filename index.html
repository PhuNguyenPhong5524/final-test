<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/4071fda5b5.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <title>Project Final Test</title>
</head>
<body>
    
    <main class="bg-[#E5E5E5] h-full p-[50px]">
        <div class="mx-auto max-w-[1290px] w-full h-full bg-base-100 ">
            <div class=" ">
                <div class=" w-full bg-[#ffffff] shadow-xl rounded-[10px] pb-[20px]">
                    <!-- Button start -->
                        <div class="flex flex-col items-center justify-center py-[20px]">
                            <button 
                                class="
                                    btn
                                    bg-green-600 text-[20px] text-[#ffffff] font-semibold px-[20px] py-[8px] rounded-[10px]
                                    cursor-pointer transform transition-all ease-in duration-300 hover:opacity-80 hover:scale-105
                                "
                            >
                                Bắt đầu
                            </button>
                            <div class="">
                                <p class="result text-[20px] text-[#FF0000] font-semibold"></p>
                            </div>
                        </div>
                    <!-- section game and time -->
                        <section>
                            <div  class="flex gap-[20px] px-[10%] pb-[20px]">
                                <!-- Left -->
                                    <div 
                                        class=" 
                                            showBoxGame
                                            w-[60%] bg-gray-100 w-full h-full grid grid-cols-4 p-[20px] gap-[10px] rounded-[10px]
                                            shadow-xl border border-gray-200
                                        "
                                    >
                                        
                                    </div>
                                <!-- Right -->
                                    <div class="w-[40%]">
                                        <!-- Đếm giờ -->
                                            <div class="bg-green-100 w-full h-auto shadow-xl rounded-[10px] border border-gray-200">
                                                <div class="flex flex-col items-center justify-center py-[40px]">
                                                    <div class="boxTime">
                                                        <h1 class="text-[18px] text-[#000000] font-bold text-center">Đếm Giờ</h1>
                                                        <p class="time text-[50px] text-[#000000] font-semibold">
                                                            00:00
                                                        </p>
                                                    </div>
                                                </div>  
                                            </div>
                                        <!-- Hướng dẫn di chuyển -->
                                            <div class="shadow-xl pb-[20px]">
                                                <h1 class="text-[18px] text-[#000000] font-bold text-center py-[20px]">Hướng dẫn di chuyển</h1>
                                                <div class="flex flex-col items-center justify-center">
                                                    <!-- Box -->
                                                        <div class="grid grid-cols-3 gap-2">
                                                            <div></div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <i class="fa-solid fa-arrow-up"></i>
                                                            </div>
                                                            <div></div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <i class="fa-solid fa-arrow-left"></i>
                                                            </div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <i class="fa-solid fa-arrow-down"></i>
                                                            </div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <i class="fa-solid fa-arrow-right"></i>
                                                            </div>    
                                                        </div>
                                                    <!-- Box -->
                                                        <div class="grid grid-cols-3 gap-2 mt-[10px]">
                                                            <div></div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <span class="text-[20px] font-semibold">W</span>
                                                            </div>
                                                            <div></div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <span class="text-[20px] font-semibold">A</span>
                                                            </div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <span class="text-[20px] font-semibold">S</span>
                                                            </div>
                                                            <div 
                                                                class="
                                                                    bg-gray-200 w-[50px] h-[50px] flex items-center justify-center rounded-[10px]
                                                                "
                                                            >
                                                                <span class="text-[20px] font-semibold">D</span>
                                                            </div>    
                                                        </div>
                                            </div>
                                    </div>
                            </div>
                        </section>
                    <!-- Section lịch sử chơi -->
                        <section class="mx-[2%]">
                            <div class="px-[2%] pb-[20px] bg-gray-100 rounded-[10px] shadow-xl border border-gray-200">
                                <h1 class="text-[20px] text-[#000000] font-bold text-center py-[20px]">Lịch sử lượt chơi</h1>
                                <div class="overflow-x-auto border border-gray-300 rounded-[10px] ">
                                    <table class="w-full">
                                        <thead class="bg-gray-200">
                                            <tr class="">
                                                <th class="py-[10px]">#Lượt chơi</th>
                                                <th class="py-[10px]">Số bước di chuyển</th>
                                                <th class="py-[10px]">Thời gian</th>
                                            </tr>
                                        </thead>
                                        <tbody class="showTbody">
                                            
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                </div>
            </div>
            
        </div>
    </main>
    
    <script src="main.js"></script>
    <!-- Flowbite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
</body>
</html>
